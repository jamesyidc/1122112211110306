<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Positive Ratio Tooltip Test</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div id="chart" style="width: 800px; height: 400px;"></div>
    <div id="debug" style="margin: 20px; font-family: monospace;"></div>
    
    <script>
        const debugLog = (msg) => {
            console.log(msg);
            document.getElementById('debug').innerHTML += msg + '<br>';
        };
        
        // 模拟从API获取的正数占比数据
        window.positiveRatioStats = {
            date: "20260306",
            positive_ratio: 0.0,
            positive_count: 0,
            total_count: 132,
            positive_duration: 0.0
        };
        
        debugLog('✅ window.positiveRatioStats 已设置:');
        debugLog(JSON.stringify(window.positiveRatioStats, null, 2));
        
        // 测试tooltip格式化函数
        function testTooltipFormatter(params) {
            debugLog('\n🔍 开始测试tooltip formatter...');
            debugLog('params数量: ' + params.length);
            
            let html = '<div style="padding: 8px;">';
            html += '<div>时间: 2026-03-06 15:30:00</div>';
            
            // 遍历所有系列
            params.forEach((param, index) => {
                debugLog(`\n参数 ${index}: seriesName="${param.seriesName}", value=${param.value}`);
                
                if (param.seriesName === '27币涨跌幅之和') {
                    debugLog('  ✅ 匹配到"27币涨跌幅之和"系列');
                    
                    html += `<div style="margin: 8px 0;">
                        <strong>${param.marker} ${param.seriesName}</strong>: ${param.value.toFixed(2)}%
                    </div>`;
                    
                    // 测试正数占比显示逻辑
                    debugLog('  检查 window.positiveRatioStats:');
                    debugLog('    存在: ' + (window.positiveRatioStats !== undefined));
                    
                    if (window.positiveRatioStats) {
                        debugLog('    positive_ratio: ' + window.positiveRatioStats.positive_ratio);
                        debugLog('    positive_ratio !== undefined: ' + (window.positiveRatioStats.positive_ratio !== undefined));
                        
                        // 关键检查：0.0 是否会被过滤
                        debugLog('    正在检查条件...');
                        if (window.positiveRatioStats.positive_ratio !== undefined) {
                            debugLog('    ✅ 条件通过！应该显示正数占比');
                            
                            const positiveRatio = window.positiveRatioStats.positive_ratio;
                            const positiveCount = window.positiveRatioStats.positive_count;
                            const totalCount = window.positiveRatioStats.total_count;
                            
                            const ratioColor = positiveRatio > 50 ? '#10b981' : '#ef4444';
                            
                            html += `
                                <div style="margin: 8px 0; padding: 6px; background: #f9fafb; border-radius: 4px;">
                                    <div style="font-size: 12px; color: #6b7280;">今日正数时段占比</div>
                                    <div style="font-size: 14px; font-weight: bold; color: ${ratioColor};">
                                        ${positiveRatio.toFixed(1)}%
                                    </div>
                                    <div style="font-size: 11px; color: #9ca3af;">
                                        ${positiveCount}/${totalCount} 数据点
                                    </div>
                                </div>
                            `;
                            
                            debugLog('    ✅ 正数占比HTML已添加');
                        } else {
                            debugLog('    ❌ positive_ratio === undefined，不显示');
                        }
                    } else {
                        debugLog('    ❌ window.positiveRatioStats 不存在');
                    }
                }
            });
            
            html += '</div>';
            return html;
        }
        
        // 模拟tooltip参数
        const mockParams = [{
            seriesName: '27币涨跌幅之和',
            value: -5.48,
            marker: '<span style="display:inline-block;margin-right:5px;border-radius:10px;width:10px;height:10px;background-color:#5470c6;"></span>'
        }];
        
        const tooltipHTML = testTooltipFormatter(mockParams);
        debugLog('\n📊 生成的tooltip HTML:');
        debugLog(tooltipHTML);
        
        // 创建图表验证实际渲染
        const chart = echarts.init(document.getElementById('chart'));
        
        chart.setOption({
            tooltip: {
                trigger: 'axis',
                formatter: testTooltipFormatter
            },
            xAxis: {
                type: 'category',
                data: ['15:00', '15:30', '16:00']
            },
            yAxis: {
                type: 'value'
            },
            series: [{
                name: '27币涨跌幅之和',
                type: 'line',
                data: [-3.2, -5.48, -4.1]
            }]
        });
        
        debugLog('\n✅ 图表已创建，鼠标悬停查看tooltip效果');
    </script>
</body>
</html>
