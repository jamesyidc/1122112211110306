<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>模拟Tooltip测试</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        #output { white-space: pre-wrap; font-family: monospace; padding: 20px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>正数占比 Tooltip 测试</h1>
    <p>这个页面会模拟图表tooltip的formatter逻辑</p>
    
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            console.log(msg);
            output.textContent += msg + '\n';
        }
        
        // 1. 模拟从API获取正数占比数据
        async function loadPositiveRatioStats() {
            log('📡 正在加载正数占比数据...\n');
            
            try {
                const response = await fetch('/api/coin-change-tracker/positive-ratio-stats?_t=' + Date.now());
                const result = await response.json();
                
                if (result.success && result.stats) {
                    window.positiveRatioStats = result.stats;
                    log('✅ 正数占比数据加载成功:');
                    log(JSON.stringify(window.positiveRatioStats, null, 2));
                    log('');
                    return true;
                } else {
                    log('❌ API返回失败\n');
                    return false;
                }
            } catch (error) {
                log('❌ API请求失败: ' + error.message + '\n');
                return false;
            }
        }
        
        // 2. 模拟tooltip formatter逻辑
        function simulateTooltipFormatter() {
            log('🔍 开始模拟tooltip formatter...\n');
            
            // 模拟参数
            const params = [{
                axisValue: '15:30:00',
                seriesName: '27币涨跌幅之和',
                value: -5.48,
                marker: '<span style="display:inline-block;margin-right:5px;border-radius:10px;width:10px;height:10px;background-color:#5470c6;"></span>',
                dataIndex: 0
            }];
            
            // 从coin_change_tracker.html中复制的formatter逻辑
            const time = params[0].axisValue;
            let html = `<div style="padding: 8px; min-width: 240px;">`;
            html += `<div style="font-weight: bold; margin-bottom: 8px; font-size: 14px;">`;
            html += `<i class="far fa-clock" style="margin-right: 4px;"></i>${time}`;
            html += `</div>`;
            
            // 遍历所有系列
            params.forEach(p => {
                if (p.seriesName === '27币涨跌幅之和') {
                    const value = p.value;
                    const upRatio = '3.7%';  // 模拟数据
                    
                    html += `<div style="margin-bottom: 4px;">`;
                    html += `${p.marker}<span style="font-weight: 600;">${p.seriesName}</span>`;
                    html += `</div>`;
                    html += `<div style="font-size: 16px; font-weight: bold; color: ${value > 0 ? '#10B981' : value < 0 ? '#EF4444' : '#6B7280'};">`;
                    html += `${value > 0 ? '+' : ''}${value}%`;
                    html += `</div>`;
                    html += `<div style="margin-top: 4px; font-size: 13px; color: #6B7280;">`;
                    html += `上涨占比: <span style="font-weight: 600; color: #10B981;">${upRatio}</span>`;
                    html += `</div>`;
                    
                    // 🔥 正数占比逻辑（从coin_change_tracker.html复制）
                    log('🔍 Tooltip formatter - 检查正数占比数据:');
                    log('  window.positiveRatioStats存在: ' + (window.positiveRatioStats !== undefined));
                    
                    if (window.positiveRatioStats) {
                        log('  positive_ratio: ' + window.positiveRatioStats.positive_ratio);
                        log('  positive_ratio类型: ' + typeof window.positiveRatioStats.positive_ratio);
                        log('  !== undefined: ' + (window.positiveRatioStats.positive_ratio !== undefined));
                    }
                    
                    if (window.positiveRatioStats && window.positiveRatioStats.positive_ratio !== undefined) {
                        log('  ✅ 条件通过！显示正数占比\n');
                        
                        const positiveRatio = window.positiveRatioStats.positive_ratio;
                        const positiveCount = window.positiveRatioStats.positive_count;
                        const totalCount = window.positiveRatioStats.total_count;
                        
                        html += `<div style="margin-top: 6px; padding: 6px; background: #F3F4F6; border-radius: 4px;">`;
                        html += `<div style="font-size: 12px; color: #6B7280; margin-bottom: 2px;">`;
                        html += `<i class="fas fa-chart-line" style="margin-right: 4px;"></i>今日正数时段占比`;
                        html += `</div>`;
                        html += `<div style="font-size: 14px; font-weight: bold; color: ${positiveRatio > 50 ? '#10B981' : '#EF4444'};">`;
                        html += `${positiveRatio.toFixed(1)}%`;
                        html += `</div>`;
                        html += `<div style="font-size: 11px; color: #9CA3AF; margin-top: 2px;">`;
                        html += `${positiveCount}/${totalCount} 数据点`;
                        html += `</div>`;
                        html += `</div>`;
                    } else {
                        log('  ❌ 条件不通过，不显示正数占比\n');
                    }
                }
            });
            
            html += `</div>`;
            
            log('📊 生成的tooltip HTML:');
            log(html);
            log('');
            
            // 检查HTML中是否包含正数占比
            if (html.includes('正数时段占比')) {
                log('✅ SUCCESS: HTML中包含正数占比！');
            } else {
                log('❌ FAIL: HTML中不包含正数占比');
            }
        }
        
        // 执行测试
        (async () => {
            const success = await loadPositiveRatioStats();
            if (success) {
                log('---\n');
                simulateTooltipFormatter();
            }
        })();
    </script>
</body>
</html>
